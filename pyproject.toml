[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.yapf]
based_on_style = "pep8"
indent_width = 4
column_limit = 120

[tool.isort]
line_length = 120

[project]
name = "tinyaudio"
version = "1.0.0"
authors = [{ name = "The TinyAudio Authors" }]
description = "TinyAudio: compact text-to-audio generation with flow matching and MeanFlow"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "torch >= 2.5.1",
  "torchaudio >= 2.5.1",
  "transformers >= 4.48",
  "huggingface_hub >= 0.34",
  "hydra-core >= 1.3.2",
  "hydra_colorlog",
  "colorlog",
  "omegaconf >= 2.3",
  "einops >= 0.6",
  "torchdiffeq >= 0.2.5",
  "nitrous-ema",
  "tensorboard >= 2.11",
  "matplotlib",
  "numpy >= 1.21",
  "scipy >= 1.7",
  "soundfile",
  "tqdm >= 4.66.1",
]

[project.optional-dependencies]
cpu = ["onnxruntime >= 1.18"]

[tool.hatch.build.targets.wheel]
packages = ["tinyaudio"]
